name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run build
      - run: git diff --check
      - name: Verify static build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test "$(find dist/assets -type f -print -quit)"
      - name: Reject credential identifiers in build
        run: |
          if grep -rlE 'NEUPRINT_TOKEN|API_FOOTBALL_KEY|x-apisports-key' dist; then
            echo 'Credential identifier found in build output.' >&2
            exit 1
          fi
