name: Daily fly

# Syncs fixtures/results, settles the fly's bets and places new ones, then commits data/.
# The git history of data/ is the public, timestamped proof that each bet predates its match.
on:
  schedule:
    - cron: '0 12 * * *' # 07:00 in Panama
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:matches
      - run: npm run fly:daily
      - name: Commit data
        run: |
          git config user.name 'drosophila-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m "data: daily fly run $(date -u +%Y-%m-%d)"
            git push
          fi
