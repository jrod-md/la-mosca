name: Daily fly

# Syncs fixtures/results, settles the fly's bets and places new ones, then commits data/.
# The git history of data/ is the public, timestamped proof that each bet predates its match.
# Commits are made by "mosca-bot", the GitHub Actions identity of this job.
on:
  # GitHub starts scheduled runs late (5 to 6 hours in practice for this repo) and sometimes drops
  # them, so the slots begin in the small hours of Panama (UTC-5) to land in its morning, with
  # backups. A slot does nothing once the fly has had its day and no result is still owed.
  schedule:
    - cron: '7 6 * * *'
    - cron: '23 7 * * *'
    - cron: '47 8 * * *'
    - cron: '13 10 * * *'
    - cron: '7 12 * * *'
    - cron: '37 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Backup slots skip when there is nothing to do; manual runs always go.
      - name: Anything to do?
        id: today
        if: github.event_name == 'schedule'
        run: node scripts/run-ts.mjs scripts/should-run.ts >> "$GITHUB_OUTPUT"
      - name: Sync matches
        id: sync
        if: steps.today.outputs.done != 'true'
        run: npm run sync:matches
      - name: Fly's day
        id: fly
        if: steps.today.outputs.done != 'true'
        run: npm run fly:daily
      # The site is rebuilt from data/ on every push; never publish data that breaks it.
      - name: Verify site with new data
        id: verify
        if: steps.today.outputs.done != 'true'
        run: |
          npm test
          npm run build
      # Always record the run, including failures (data/runs.json logs them), unless the
      # new data would break the site.
      - name: Commit data
        if: always() && steps.verify.outcome != 'failure' && steps.today.outputs.done != 'true'
        run: |
          git config user.name 'mosca-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m "data: daily fly run $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
