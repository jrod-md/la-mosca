name: Daily fly

# Syncs fixtures/results, settles the fly's bets and places new ones, then commits data/.
# The git history of data/ is the public, timestamped proof that each bet predates its match.
# Commits are made by "mosca-bot", the GitHub Actions identity of this job.
on:
  # GitHub often delays or drops scheduled runs, so the morning has several off-the-hour slots.
  # The job is idempotent: it never decides or settles anything twice, so later slots are no-ops
  # once one has run.
  schedule:
    - cron: '7 12 * * *' # 07:07 in Panama
    - cron: '47 12 * * *' # 07:47, backup
    - cron: '23 13 * * *' # 08:23, backup
    - cron: '37 14 * * *' # 09:37, backup
    - cron: '13 16 * * *' # 11:13, backup
    - cron: '43 17 * * *' # 12:43, last backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Backup slots do nothing once the fly has had its day (Panama date); manual runs always go.
      - name: Already ran today?
        id: today
        if: github.event_name == 'schedule'
        run: |
          node -e "
            const day = iso => new Date(Date.parse(iso) - 5 * 3600e3).toISOString().slice(0, 10)
            const { runs } = JSON.parse(require('fs').readFileSync('data/runs.json', 'utf8'))
            const done = runs.some(run => run.job === 'fly-daily' && run.ok && day(run.at) === day(new Date().toISOString()))
            console.log('done=' + done)
          " >> "$GITHUB_OUTPUT"
      - run: npm ci
        if: steps.today.outputs.done != 'true'
      - name: Sync matches
        id: sync
        if: steps.today.outputs.done != 'true'
        run: npm run sync:matches
      - name: Fly's day
        id: fly
        if: steps.today.outputs.done != 'true'
        run: npm run fly:daily
      # The site is rebuilt from data/ on every push; never publish data that breaks it.
      - name: Verify site with new data
        id: verify
        if: steps.today.outputs.done != 'true'
        run: |
          npm test
          npm run build
      # Always record the run, including failures (data/runs.json logs them), unless the
      # new data would break the site.
      - name: Commit data
        if: always() && steps.verify.outcome != 'failure' && steps.today.outputs.done != 'true'
        run: |
          git config user.name 'mosca-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m "data: daily fly run $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
